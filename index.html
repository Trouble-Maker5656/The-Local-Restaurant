<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE LOCAL RESTARUANT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ====navbar==== -->
    <header>
        <nav class="navbar section-conten">
            <a href="#" class="nav-logo">
                <h2 class="logo-text">The Local</h2>
            </a>

            <ul class="nav-menu">
                <button id="close-menu" class="fa-solid fa-xmark"></button>
                <div class="mobile-logo">
                    <p class="mobile-logo-text">The Local</p>
                </div>
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Menu</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Gallery</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Account</a>
                </li>
            </ul>
            <button id="open-menu"class="fa-solid fa-bars"></button>
        </nav>
    </header>
    <main>
        <!-- ====Hero section==== -->
        <section class="hero-conten">
            <div class="section-conten">
                <div class="hero-detail">
                    <h2 class="title">Our Signature Dishes</h2>
                    <h3 class="detail">Taste Every Bite of Italy</h3>
                    <p class="description">Classic pasta tossed in a rich, savory Bolognese sauce with tender ground
                        beef,
                        tomatoes, herbs, and Parmesan cheese.</p>
                    <div class="buttons">
                        <a href="#" class="button Order-now">Order Now</a>
                        <a href="#" class="button see-more">See More</a>

                    </div>
                </div>
                <div class="hero-image-wrapper">
                    <img src="pic/pasta dishe.png" alt="hero" class="hero-image">
                </div>
            </div>
        </section>

        <!-- ====About section==== -->

        <section class="about-section">
            <div class="section-conten">
                <div class="about-image-wrapper">
                    <img src="pic/" alt="">
                </div>
            </div>

        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
